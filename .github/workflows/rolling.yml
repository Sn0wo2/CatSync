name: Rolling Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  rolling-release:
    name: GoReleaser Rolling
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create semver tag for goreleaser
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          git tag "v0.0.0-rolling.$TIMESTAMP"
          git push origin "v0.0.0-rolling.$TIMESTAMP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean -f .goreleaser.rolling.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename release to fixed tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          gh release edit $LATEST_TAG --tag rolling --title "Rolling Release - $(date +'%Y-%m-%d %H:%M:%S')" --prerelease
          git push --delete origin $LATEST_TAG || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}