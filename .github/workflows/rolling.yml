name: Rolling Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  rolling-release:
    name: GoReleaser Rolling
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true
    permissions:
      contents: write
      packages: write
    if: ${{ !startsWith(github.event_name, 'pull_request') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete current release assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: v0.0.0-rolling
          deleteOnlyFromDrafts: false

      - name: Force update git tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -f v0.0.0-rolling
          git push -f origin v0.0.0-rolling

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: v0.0.0-rolling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean -f .goreleaser.rolling.yml --release-notes ROLLING.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release
        run: gh release edit v0.0.0-rolling --title "Rolling CatSync!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}