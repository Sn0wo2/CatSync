name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  vet-test-update-build:
    name: Vet, Test, Update and Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -v -o BuildTest ./cmd

      - name: Remove binary
        run: rm BuildTest

      - name: Check for file changes
        id: git-check
        run: |
          if git diff --exit-code; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with update dependencies
        if: steps.git-check.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(deps): update dependencies"
          title: "chore(deps): update dependencies"
          body: "The `update dependencies` action wants to apply these fixes."
          branch: "chore/go-dependencies"
          base: main
          signoff: true
          sign-commits: true

  lint:
    name: Lint and Auto-fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint with auto-fix
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --fix

      - name: Check for file changes
        id: git-check
        run: |
          if git diff --exit-code; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with lint fixes
        if: steps.git-check.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(lint): fix issues"
          title: "chore(lint): fix issues"
          body: "The `golangci-lint` action wants to apply these fixes."
          branch: "chore/go-lint-fixes"
          base: main
          signoff: true
          sign-commits: true

  rolling-release:
    name: Rolling Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --config .goreleaser.rolling.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
