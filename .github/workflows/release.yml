name: Release

on:
  push:
    tags: ['v*.*.*', 'v*.*.*-*']
    branches: [main, dev]
  workflow_dispatch:
  
jobs:
  release:
    name: GoReleaser
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rolling-release:
    name: GoReleaser Rolling
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-rolling
      cancel-in-progress: true
    permissions:
      contents: write
      packages: write
  
      steps:
        - name: Checkout repository
          uses: actions/checkout@v5
          with:
            fetch-depth: 0
  
        - name: Setup Go
          uses: actions/setup-go@v6
          with:
            go-version-file: 'go.mod'
            cache: true
  
        - name: Set up QEMU
          uses: docker/setup-qemu-action@v3
  
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
          with:
            install: true
            driver-opts: network=host
  
        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Force update git tag
          run: |
            git config user.name "${{ github.actor }}"
            git config user.email "${{ github.actor }}@users.noreply.github.com"
            git tag -f v0.0.0-rolling
            git push -f origin v0.0.0-rolling
            gh release delete v0.0.0-rolling --yes | true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Run GoReleaser
          uses: goreleaser/goreleaser-action@v6
          with:
            version: latest
            args: release --clean -f .goreleaser.rolling.yml --release-notes ROLLING.md
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Update Release
          run: gh release edit v0.0.0-rolling --title "Rolling CatSync!"
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}