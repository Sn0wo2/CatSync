name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      snapshot:
        description: Build a snapshot without publishing
        type: boolean
        required: true
        default: true

permissions:
  checks: read
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.snapshot && 'snapshot' || 'publish' }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.snapshot == true }}

jobs:
  check-release:
    if: github.ref_type == 'tag' || inputs.snapshot
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        if: github.ref_type == 'tag' && !inputs.snapshot
        with:
          persist-credentials: false

      - name: Check for an already published release
        id: release
        if: github.ref_type == 'tag' && !inputs.snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release.js

  release:
    needs: check-release
    if: needs.check-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Reuse CI checks for this commit
        if: github.ref_type == 'tag' && !inputs.snapshot
        timeout-minutes: 15
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.sha }}
          check-name: Checks
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allowed-conclusions: success

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref_type == 'tag' && !inputs.snapshot
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-runtime@v4

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean ${{ inputs.snapshot && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && inputs.snapshot }}
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt
            dist/artifacts.json
            dist/metadata.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
