version: 2
project_name: CatSync

release:
  prerelease: auto

builds:
  - id: "{{ .ProjectName }}"
    main: ./cmd
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=0
      - TZ=Asia/Shanghai
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
      - v3
    flags:
      - -mod=readonly
      - -trimpath
      - -tags=catsync_all
    ldflags:
      - -s -w
      - -X github.com/prometheus/common/version.Version={{.Version}}
      - -X github.com/prometheus/common/version.Revision={{.Commit}}
      - -X github.com/prometheus/common/version.Branch={{.Branch}}
      - -X github.com/prometheus/common/version.BuildDate={{.Date}}

dockers_v2:
  - ids:
      - "{{ .ProjectName }}"
    images:
      - ghcr.io/sn0wo2/catsync
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
      - "beta-latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Sync the\u300Ccat\u300Dconfig."
      org.opencontainers.image.source: "https://github.com/Sn0wo2/{{ .ProjectName }}"
      org.opencontainers.image.url: "https://github.com/Sn0wo2/{{ .ProjectName }}"
      org.opencontainers.image.vendor: "Sn0wo2"
      org.opencontainers.image.authors: "Sn0wo2"
      org.opencontainers.image.licenses: "MIT"
      org.opencontainers.image.license.name: "MIT License"
      org.opencontainers.image.license.spdx: "MIT"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.revision: "{{.Commit}}"
      org.opencontainers.image.git.branch: "{{ .Branch }}"
      org.opencontainers.image.created: "{{.Date}}"

changelog:
  use: github
  groups:
    - title: 「Features」
      regexp: "^.*feat(?:\\([^)]+\\))?:+.*$"
      order: 0
    - title: 「Bug Fixes」
      regexp: "^.*fix(?:\\([^)]+\\))?:+.*$"
      order: 1
    - title: 「Performance Improvements」
      regexp: "^.*perf(?:\\([^)]+\\))?:+.*$"
      order: 2
    - title: 「Documentation」
      regexp: "^.*docs(?:\\([^)]+\\))?:+.*$"
      order: 3
    - title: 「Maintenance & Chores」
      regexp: "^.*chore(?:\\([^)]+\\))?:+.*$"
      order: 4
    - title: 「Code Refactoring」
      regexp: "^.*refactor(?:\\([^)]+\\))?:+.*$"
      order: 5
    - title: 「Tests」
      regexp: "^.*test(?:\\([^)]+\\))?:+.*$"
      order: 6
    - title: 「Dependency Updates」
      regexp: "^.*deps(?:\\([^)]+\\))?:+.*$"
      order: 7
    - title: 「Others」
      order: 999
