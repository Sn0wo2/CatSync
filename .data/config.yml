log:
    dir: ./logs
    level: debug
    fileFormat: 2006-01-02.log
server:
    address: :3000
    tls:
        cert: null
        key: null
modifiers:
    - actionModifierResponseHeader:
        header:
            Server:
                - CatSync
            X-CatSync-Version:
                - ${VERSION}
actions:
    - route: ^/$
      type: server
      actionModifierResponseHeader:
        header:
            Content-Type:
                - text/html; charset=utf-8
      server:
        directory: server/welcome
    - route: ^/string$
      type: string
      actionModifierResponseHeader:
        header:
            Content-Type:
                - text/plain; charset=utf-8
      string:
        content: |
            ActionString: plain text response
    - route: ^/file$
      type: file
      actionModifierResponseHeader:
        header:
            Cache-Control:
                - public, max-age=60
      file:
        path: ./data/hello.txt
        dontSetContentType: false
    - route: ^/status/200$
      type: string
      actionModifierResponseHeader:
        header:
            Content-Type:
                - text/plain; charset=utf-8
      actionModifierStatus:
        status: 200
      string:
        content: |
            Status: 200 OK
    - route: ^/status/201$
      type: string
      actionModifierResponseHeader:
        header:
            Content-Type:
                - text/plain; charset=utf-8
      actionModifierStatus:
        status: 201
      string:
        content: |
            Status: 201 Created
    - route: ^/status/204$
      type: string
      actionModifierStatus:
        status: 204
      string:
        content: null
    - route: ^/headers$
      type: string
      actionModifierResponseHeader:
        header:
            Content-Type:
                - text/plain; charset=utf-8
            X-Global:
                - from-global-modifier
      string:
        actionModifierResponseHeader:
            header:
                X-Payload:
                    - from-payload
        content: |
            Headers demo - check response headers:
            - X-Global: from-global-modifier
            - X-Payload: from-payload
    - route: ^/auth$
      type: string
      actionModifierResponseHeader:
        header:
            Content-Type:
                - text/plain; charset=utf-8
      actionModifierAuth:
        header:
            X-Token:
                - ^secret$
        fallback:
            type: next
      string:
        content: |
            Auth success! (X-Token: secret)
    - route: ^/auth/jump$
      type: string
      actionModifierResponseHeader:
        header:
            Content-Type:
                - text/plain; charset=utf-8
      actionModifierAuth:
        header:
            X-Token:
                - ^secret$
        fallback:
            type: jump
            jumpTo: 10
      string:
        content: |
            Auth success with jump!
    - route: ^/auth/fallback$
      type: string
      actionModifierResponseHeader:
        header:
            Content-Type:
                - text/plain; charset=utf-8
      actionModifierStatus:
        status: 401
      string:
        content: |
            Auth failed - jumped to fallback
    - route: ^/reload$
      type: reload
      actionModifierResponseHeader:
        header:
            Content-Type:
                - text/plain; charset=utf-8
      reload: {}
    - route: ""
      type: server
      actionModifierResponseHeader:
        header:
            Content-Type:
                - text/html; charset=utf-8
      actionModifierStatus:
        status: 404
      server:
        directory: server/welcome
        notFoundHTML: |-
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>404 | CatSync</title>
                <style>
                    *{margin:0;padding:0;box-sizing:border-box}
                    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#0a0a0a;color:#e0e0e0}
                    .c{text-align:center;padding:2rem}
                    .code{font-size:8rem;font-weight:200;letter-spacing:-.04em;line-height:1;color:#fff}
                    .line{width:48px;height:1px;background:#333;margin:1.5rem auto}
                    .msg{font-size:.875rem;color:#666;letter-spacing:.08em;text-transform:uppercase}
                    .link{display:inline-block;margin-top:2.5rem;font-size:.75rem;color:#555;text-decoration:none;letter-spacing:.06em;border-bottom:1px solid #333;padding-bottom:2px;transition:color .2s,border-color .2s}
                    .link:hover{color:#fff;border-color:#fff}
                </style>
            </head>
            <body>
                <div class="c">
                    <div class="code">404</div>
                    <div class="line"></div>
                    <p class="msg">Not Found</p>
                    <a href="https://github.com/Sn0wo2/CatSync" class="link" target="_blank" rel="noopener">CatSync</a>
                </div>
            </body>
            </html>
