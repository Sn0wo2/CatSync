version: 2
project_name: catsync

release:
  prerelease: true

builds:
  - id: CatSync
    main: ./cmd
    binary: CatSync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -mod=readonly
      - -trimpath
    ldflags:
      - -s -w
      - -extldflags=-static,-Wl,-O3
      - "-X github.com/Sn0wo2/CatSync/version.version={{.Version}}"
      - "-X github.com/Sn0wo2/CatSync/version.commit={{.Commit}}"
      - "-X github.com/Sn0wo2/CatSync/version.date={{.Date}}"

dockers_v2:
  - images:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}"
    tags:
      - rolling
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Sync the「cat」config."
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
    platforms:
      - linux/amd64
      - linux/arm64
    ids:
      - CatSync

changelog:
  disable: true