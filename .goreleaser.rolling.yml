version: 2
project_name: catsync

builds:
  - id: CatSync
    main: ./cmd
    binary: CatSync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - "386"
      - arm64
      - ppc64le
      - riscv64
    flags:
      - -mod=readonly
      - -trimpath
    ldflags:
      - -s -w
      - -extldflags=-static,-Wl,-O3
      - "-X github.com/Sn0wo2/CatSync/version.version={{.Version}}"
      - "-X github.com/Sn0wo2/CatSync/version.commit={{.Commit}}"
      - "-X github.com/Sn0wo2/CatSync/version.date={{.Date}}"

dockers_v2:
  - id: catsync
    images:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}"
    tags:
      - "{{ .Tag }}"
    ids:
      - CatSync
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Sync the「cat」config."
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
    platforms:
      - linux/amd64
      - linux/386
      - linux/arm64
      - linux/ppc64le
      - linux/riscv64

changelog:
  disable: false
  use: github
  sort: asc
  groups:
    - title: "🚀 Features"
      regexp: "^.*feat(?:\\([^)]+\\))?:+.*$"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^.*fix(?:\\([^)]+\\))?:+.*$"
      order: 1
    - title: "⚡️ Performance Improvements"
      regexp: "^.*perf(?:\\([^)]+\\))?:+.*$"
      order: 2
    - title: "📝 Documentation"
      regexp: "^.*docs(?:\\([^)]+\\))?:+.*$"
      order: 3
    - title: "🔧 Maintenance & Chores"
      regexp: "^.*chore(?:\\([^)]+\\))?:+.*$"
      order: 4
    - title: "♻️ Code Refactoring"
      regexp: "^.*refactor(?:\\([^)]+\\))?:+.*$"
      order: 5
    - title: "🧪 Tests"
      regexp: "^.*test(?:\\([^)]+\\))?:+.*$"
      order: 6
    - title: "📦 Dependency Updates"
      regexp: "^.*deps(?:\\([^)]+\\))?:+.*$"
      order: 7
    - title: "📍 Others"
      order: 999