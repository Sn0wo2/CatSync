version: 2
project_name: catsync

release:
  prerelease: true

builds:
  - id: CatSync
    main: ./cmd
    binary: CatSync
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    goamd64:
      - v1
      - v2
      - v3
      - v4
    flags:
      - -mod=readonly
      - -trimpath
    ldflags:
      - -s -w
      - -extldflags=-static,-Wl,-O3
      - "-X github.com/Sn0wo2/CatSync/version.version={{.Version}}"
      - "-X github.com/Sn0wo2/CatSync/version.commit={{.Commit}}"
      - "-X github.com/Sn0wo2/CatSync/version.date={{.Date}}"

dockers:
  - image_templates:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-amd64v1"
    use: buildx
    goos: linux
    goarch: amd64
    goamd64: v1
  - image_templates:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-amd64v2"
    use: buildx
    goos: linux
    goarch: amd64
    goamd64: v2
  - image_templates:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-amd64v3"
    use: buildx
    goos: linux
    goarch: amd64
    goamd64: v3
  - image_templates:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-amd64v4"
    use: buildx
    goos: linux
    goarch: amd64
    goamd64: v4
  - image_templates:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-386"
    use: buildx
    goos: linux
    goarch: "386"
  - image_templates:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-armv6"
    use: buildx
    goos: linux
    goarch: arm
    goarm: "6"
  - image_templates:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-armv7"
    use: buildx
    goos: linux
    goarch: arm
    goarm: "7"
  - image_templates:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-arm64"
    use: buildx
    goos: linux
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}"
    image_templates:
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-amd64v1"
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-amd64v2"
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-amd64v3"
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-amd64v4"
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-386"
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-armv6"
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-armv7"
      - "ghcr.io/sn0wo2/{{ .ProjectName }}:{{ .Tag }}-arm64"